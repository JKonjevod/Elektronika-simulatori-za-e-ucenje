<!DOCTYPE html>
<html lang="hr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ispravljači – interaktivni prikaz</title><style>
:root{--bg:#FFFFFF;--ink:#1d1d1d;--muted:#757575;--line:#D9DCE3;--blue:#164194;--blue-soft:#EEF2FA;--gold:#B19E3F;--gold-soft:#F6F2DF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181F;--ink:#ECEDF0;--muted:#A3A7B0;--line:#2E3440;--blue:#8EA7E8;--blue-soft:#1E2740;--gold:#D4C06A;--gold-soft:#2D2A1A}}
:root[data-theme="dark"]{--bg:#15181F;--ink:#ECEDF0;--muted:#A3A7B0;--line:#2E3440;--blue:#8EA7E8;--blue-soft:#1E2740;--gold:#D4C06A;--gold-soft:#2D2A1A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Liberation Sans",Helvetica,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:16px 28px 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tabs button{border:2px solid var(--blue);background:transparent;color:var(--blue);font:inherit;font-size:16px;padding:9px 16px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--blue);color:var(--bg);font-weight:bold}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:start}
svg{display:block;width:100%;height:auto;max-width:100%}
.v{font-family:"Times New Roman","Liberation Serif",serif;font-style:italic}
.v tspan{font-style:normal}
svg text{font-family:Arial,"Liberation Sans",sans-serif}
svg text.v{font-family:"Times New Roman","Liberation Serif",serif}
.dio .tri{fill:var(--blue-soft);transition:fill .12s}
.dio.on .tri{fill:var(--gold)}
.cur{opacity:.12;transition:opacity .12s}
.cur.on{opacity:1}
.circ{display:none}.circ.act{display:block}
.circ[data-k="hw"] svg{max-width:78%;margin:10px auto 0}
.now{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:center;margin-top:10px;font-size:17px;color:var(--muted)}
.now b{color:var(--ink);font-variant-numeric:tabular-nums}
.state{display:block;text-align:center;margin-top:8px;font-size:16px;font-weight:bold;color:var(--muted);min-height:1.3em}
.state.on{color:var(--gold)}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);margin:0 0 2px 4px}
.leg>span{display:inline-flex;align-items:center;gap:6px}
.leg i.sw{display:inline-block;width:20px;border-top-width:3px;border-top-style:solid}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 28px;align-items:end;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.ctl label{display:flex;justify-content:space-between;font-size:16px;color:var(--muted);margin-bottom:8px}
.ctl label output{color:var(--blue);font-weight:bold;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--blue);height:28px}
.seg{display:flex;border:2px solid var(--blue);border-radius:8px;overflow:hidden;width:max-content}
.seg button{border:0;background:transparent;color:var(--blue);font:inherit;font-size:15px;padding:9px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--bg);font-weight:bold}
.play{border:2px solid var(--gold);background:var(--gold-soft);color:var(--ink);font:inherit;font-size:15px;font-weight:bold;padding:9px 18px;border-radius:8px;cursor:pointer;min-width:132px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:16px}
.fact{padding:4px 16px;border-left:1px solid var(--line)}
.fact:first-child{border-left:0;padding-left:0}
.fact .k{font-size:14px;color:var(--muted);margin-bottom:4px;min-height:2.4em}
.fact .val{font-size:26px;font-weight:bold;color:var(--blue);font-variant-numeric:tabular-nums}
.fact .f{font-size:13px;color:var(--muted);margin-top:2px}
.vi{font-family:"Times New Roman","Liberation Serif",serif;font-style:italic;font-size:1.12em}
@media (max-width:900px){.stage{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr;row-gap:14px}.fact{border-left:0;padding-left:0}}
</style></head>

" stroke-linejoin="round"/><line x1="686" y1="260.0" x2="754" y2="260.0" stroke="var(--blue)" stroke-width="5"/><line x1="686" y1="280.0" x2="754" y2="280.0" stroke="var(--blue)" stroke-width="5"/><text x="664.0" y="283.0" class="v" font-size="38" fill="var(--blue)" text-anchor="end">C</text><rect x="994" y="215.0" width="32" height="110" rx="3" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="3.5"/><text x="980.0" y="283.0" class="v" font-size="38" fill="var(--blue)" text-anchor="end">R<tspan font-size="23" dy="9">T</tspan></text><text x="1088.0" y="186.0" font-size="34" fill="var(--muted)" text-anchor="middle">+</text><text x="1088.0" y="374.0" font-size="34" fill="var(--muted)" text-anchor="middle">−</text><text x="1056.0" y="284.0" class="v" font-size="38" fill="var(--gold)" text-anchor="start">u<tspan font-size="23" dy="9">IZ</tspan></text><circle cx="720" cy="110" r="8" fill="var(--blue)"/><circle cx="720" cy="430" r="8" fill="var(--blue)"/><path d="M720,430 L720,448 M696,448 L744,448 M705,458 L735,458 M714,468 L726,468" fill="none" stroke="var(--blue)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><g id="cf-iD" class="cur"><line x1="462.0" y1="76.0" x2="540.0" y2="76.0" stroke="var(--gold)" stroke-width="3.2" marker-end="url(#gacf)"/><text x="500.0" y="58.0" class="v" font-size="34" fill="var(--gold)" text-anchor="middle">i<tspan font-size="21" dy="8">D</tspan></text></g><g id="cf-iR" class="cur"><line x1="827.0" y1="76.0" x2="903.0" y2="76.0" stroke="var(--gold)" stroke-width="3.2" marker-end="url(#gacf)"/><text x="865.0" y="58.0" class="v" font-size="34" fill="var(--gold)" text-anchor="middle">i<tspan font-size="21" dy="8">R</tspan></text></g><g id="cf-iC" class="cur"><g id="cf-iCarr" data-c="764 346.0"><line x1="764.0" y1="310.0" x2="764.0" y2="382.0" stroke="var(--gold)" stroke-width="3.2" marker-end="url(#gacf)"/></g><text x="782.0" y="366.0" class="v" font-size="34" fill="var(--gold)" text-anchor="start">i<tspan font-size= <script>(function(){
var NS="http://www.w3.org/2000/svg";
var st={k:"hw",Um:12,R:1000,C:100,UD:0.7,t:5,play:false};
var N=2000,T=40,dt=T/N,ox=62,W=620;
var $=function(id){return document.getElementById(id);};
var nf=function(x,d){return (Math.abs(x)<1e-9?0:x).toLocaleString("hr-HR",{minimumFractionDigits:0,maximumFractionDigits:d});};
function fmtI(ma){var a=Math.abs(ma);if(a>=1000)return nf(ma/1000,2)+" A";if(a>=1)return nf(ma,1)+" mA";return nf(ma*1000,0)+" µA";}
function fmtR(r){return r<1000?nf(Math.round(r/10)*10,0)+" Ω":nf(r/1000,r<10000?1:0)+" kΩ";}
function fmtC(c){return c<100?nf(c,1)+" µF":nf(Math.round(c),0)+" µF";}
var sub=function(b,s,it){return '<span class="vi">'+b+'</span><sub>'+s+'</sub>';};
var BLUE="var(--blue)",GOLD="var(--gold)";
var SER={
 hw:[{k:"iD",lab:sub("i","D"),col:GOLD}],
 ct:[{k:"iD1",lab:sub("i","D1"),col:GOLD},{k:"iD2",lab:sub("i","D2"),col:BLUE}],
 br:[{k:"iA",lab:sub("i","D1")+" = "+sub("i","D3"),col:GOLD},{k:"iB",lab:sub("i","D2")+" = "+sub("i","D4"),col:BLUE}],
 cf:[{k:"iC",lab:sub("i","C"),col:GOLD},{k:"iR",lab:sub("i","R"),col:BLUE,dash:true}]
};
var S=null;
function simulate(){
  var k=st.k,Um=st.Um,R=st.R,UD=st.UD,w=2*Math.PI/20;
  var t=[],u=[],v=[],c={},cond=[],i;
  SER[k].forEach(function(s){c[s.k]=[];});
  if(k==="cf"){
    var RC=R*st.C/1000, vv=Math.max(0,Um-UD), decay=Math.exp(-dt/RC), steps=N/2;
    for(i=0;i<steps*12;i++){var e=Um*Math.sin(w*(i+1)*dt)-UD,d=vv*decay;vv=(e>=d)?e:d;}
    var prev=vv;
    for(i=0;i<=N;i++){
      var tt=i*dt,uu=Um*Math.sin(w*tt),ee=uu-UD,dd=prev*decay,on=false,nv;
      if(i===0){nv=prev;on=ee>=prev-1e-9;}else if(ee>=dd){nv=ee;on=true;}else{nv=dd;}
      var ic=i===0?0:st.C*(nv-prev)/dt;
      t.push(tt);u.push(uu);v.push(nv);c.iR.push(nv/R*1000);c.iC.push(ic);cond.push(on);prev=nv;
    }
    c.iC[0]=c.iC[N/2];
  } else {
    for(i=0;i<=N;i++){
      var tt2=i*dt,x=Um*Math.sin(w*tt2),o;
      t.push(tt2);u.push(x);
      if(k==="hw"){o=Math.max(0,x-UD);c.iD.push(o/R*1000);cond.push(o>0);}
      else if(k==="ct"){o=Math.max(0,Math.abs(x)-UD);c.iD1.push(x>0?o/R*1000:0);c.iD2.push(x<0?o/R*1000:0);cond.push(o>0);}
      else {o=Math.max(0,Math.abs(x)-2*UD);c.iA.push(x>0?o/R*1000:0);c.iB.push(x<0?o/R*1000:0);cond.push(o>0);}
      v.push(o);
    }
  }
  var a=N/2,sum=0,sq=0,mx=-1e9,mn=1e9,idm=0,piv=0;
  for(i=a;i<N;i++){sum+=v[i];sq+=v[i]*v[i];mx=Math.max(mx,v[i]);mn=Math.min(mn,v[i]);}
  var n=N-a,avg=sum/n,rms=Math.sqrt(sq/n),rr=Math.sqrt(Math.max(0,rms*rms-avg*avg));
  for(i=0;i<=N;i++){
    if(k==="hw")idm=Math.max(idm,c.iD[i]);
    else if(k==="ct")idm=Math.max(idm,c.iD1[i],c.iD2[i]);
    else if(k==="br")idm=Math.max(idm,c.iA[i],c.iB[i]);
    else if(cond[i])idm=Math.max(idm,c.iC[i]+c.iR[i]);
    if(k==="hw"||k==="cf")piv=Math.max(piv,v[i]-u[i]);
    else if(k==="ct")piv=Math.max(piv,v[i]+Math.abs(u[i]));
  }
  if(k==="br")piv=Math.max(0,Um-UD);
  S={t:t,u:u,v:v,c:c,cond:cond,avg:avg,rms:rms,rr:rr,r:avg>1e-6?rr/avg:0,pp:mx-mn,mx:mx,idm:idm,piv:piv};
}
/* grafovi */
var gV=$("gV"),gI=$("gI");
function el(g,n,a,txt){var e=document.createElementNS(NS,n);for(var i in a)e.setAttribute(i,a[i]);if(txt!=null)e.textContent=txt;g.appendChild(e);return e;}
var X=function(t){return ox+W*t/T;};
var oyV=150,kV=5.2; var YV=function(x){return oyV-kV*x;};
function axes(g,oy,top,bot,unit,tUp){
  el(g,"path",{d:"M"+(ox-6)+","+oy+" L"+(ox+W+24)+","+oy,stroke:"var(--muted)","stroke-width":2,fill:"none"});
  el(g,"path",{d:"M"+(ox+W+24)+","+(oy-6)+" L"+(ox+W+36)+","+oy+" L"+(ox+W+24)+","+(oy+6)+" Z",fill:"var(--muted)"});
  el(g,"path",{d:"M"+ox+","+bot+" L"+ox+","+(top+10),stroke:"var(--muted)","stroke-width":2,fill:"none"});
  el(g,"path",{d:"M"+(ox-6)+","+(top+12)+" L"+ox+","+top+" L"+(ox+6)+","+(top+12)+" Z",fill:"var(--muted)"});
  var tl=el(g,"text",{x:ox+W+22,y:tUp?oy-10:oy+28,"font-size":22,fill:"var(--muted)",class:"v"},"t");
  el(g,"text",{x:ox+10,y:top+14,"font-size":13,fill:"var(--muted)"},unit);
}
function buildV(){
  gV.innerHTML="";
  [-20,-10,10,20].forEach(function(x){el(gV,"line",{x1:ox,y1:YV(x),x2:ox+W,y2:YV(x),stroke:"var(--line)","stroke-width":1});el(gV,"text",{x:ox-10,y:YV(x)+5,"text-anchor":"end","font-size":14,fill:"var(--muted)"},nf(x,0));});
  [10,20,30,40].forEach(function(t){el(gV,"text",{x:X(t),y:oyV+22,"text-anchor":"middle","font-size":13,fill:"var(--muted)"},t);});
  el(gV,"text",{x:ox+W-2,y:oyV+40,"text-anchor":"end","font-size":12,fill:"var(--muted)"},"ms");
  axes(gV,oyV,8,oyV+140,"V");
}
var pU,pV,curV,dU,dV,curI,dots=[],paths=[];
function pathStr(arr,Y){var s="";for(var i=0;i<=N;i+=2)s+=(i?"L":"M")+X(i*dt).toFixed(1)+","+Y(arr[i]).toFixed(1);return s;}
var oyI,kI;
function draw(){
  buildV();
  pU=el(gV,"path",{d:pathStr(S.u,YV),fill:"none",stroke:BLUE,"stroke-width":2.2,"stroke-dasharray":"9 7"});
  pV=el(gV,"path",{d:pathStr(S.v,YV),fill:"none",stroke:GOLD,"stroke-width":4.2,"stroke-linejoin":"round"});
  curV=el(gV,"line",{y1:10,y2:oyV+140,stroke:"var(--ink)","stroke-width":1.2,opacity:.5});
  dU=el(gV,"circle",{r:5.5,fill:"var(--bg)",stroke:BLUE,"stroke-width":2.5});
  dV=el(gV,"circle",{r:6.5,fill:GOLD,stroke:"var(--bg)","stroke-width":2});
  $("legV").innerHTML='<span><i class="sw" style="border-top-style:dashed;border-color:var(--blue)"></i><span>'+sub("u","UL")+'</span></span><span><i class="sw" style="border-color:var(--gold)"></i><span>'+sub("u","IZ")+'</span></span>';
  // struje
  gI.innerHTML="";var ser=SER[st.k],mx=0,mn=0;
  ser.forEach(function(s){S.c[s.k].forEach(function(x){if(x>mx)mx=x;if(x<mn)mn=x;});});
  if(mx<=0)mx=1;
  var top=14,bot=176,span=bot-top-10;
  var lo=Math.min(0,mn),hi=mx*1.12;
  if(-lo>hi*0.35)lo=-hi*0.35;
  kI=span/(hi-lo);oyI=top+10+hi*kI;
  var YI=function(x){return oyI-kI*Math.max(lo,x);};
  el(gI,"line",{x1:ox,y1:YI(mx),x2:ox+W,y2:YI(mx),stroke:"var(--line)","stroke-width":1});
  el(gI,"text",{x:ox-10,y:YI(mx)+5,"text-anchor":"end","font-size":13,fill:"var(--muted)"},fmtI(mx).replace(" mA","").replace(" A","").replace(" µA",""));
  el(gI,"text",{x:ox-10,y:oyI+5,"text-anchor":"end","font-size":13,fill:"var(--muted)"},"0");
  axes(gI,oyI,top-6,bot,mx>=1000?"A":(mx>=1?"mA":"µA"),true);
  paths=[];dots=[];
  ser.forEach(function(s){
    var a={d:pathStr(S.c[s.k],YI),fill:"none",stroke:s.col,"stroke-width":s.dash?2.4:3.4,"stroke-linejoin":"round"};
    if(s.dash)a["stroke-dasharray"]="8 6";
    paths.push(el(gI,"path",a));
  });
  curI=el(gI,"line",{y1:4,y2:bot,stroke:"var(--ink)","stroke-width":1.2,opacity:.5});
  ser.forEach(function(s){dots.push(el(gI,"circle",{r:5.5,fill:s.col,stroke:"var(--bg)","stroke-width":2}));});
  gI._Y=YI;
  $("legI").innerHTML=ser.map(function(s){return '<span><i class="sw" style="border-color:'+s.col+(s.dash?';border-top-style:dashed':'')+'"></i><span>'+s.lab+'</span></span>';}).join("");
  facts();drawNow();
}
function facts(){
  var k=st.k,f=[];
  var srF={hw:"≈ "+sub("U","IZm")+" / π",ct:"≈ 2"+sub("U","IZm")+" / π",br:"≈ 2"+sub("U","IZm")+" / π",cf:"≈ "+sub("U","IZm")+" − "+sub("U","IZvm")}[k];
  f.push(["Srednja vrijednost "+sub("U","IZsr"),nf(S.avg,2)+" V",srF]);
  if(k==="cf")f.push(["Valovitost (vrh–vrh) 2"+sub("U","IZvm"),nf(S.pp,2)+" V","ovisi o "+sub("R","T")+"·"+'<span class="vi">C</span>']);
  else f.push(["Efektivna vrijednost "+sub("U","IZef"),nf(S.rms,2)+" V",k==="hw"?sub("U","IZm")+" / 2":sub("U","IZm")+" / √2"]);
  f.push(["Faktor valovitosti <span class=\"vi\">r</span>",nf(S.r*100,S.r<0.1?1:0)+" %",sub("U","ref")+" / "+sub("U","IZsr")]);
  f.push(["Vršna struja diode "+sub("I","Dm"),fmtI(S.idm),k==="cf"?"puno veća od "+sub("i","R"):sub("U","IZm")+" / "+sub("R","T")]);
  var pv={hw:"≈ "+sub("U","ULm"),ct:"≈ 2"+sub("U","ULm"),br:"≈ "+sub("U","ULm"),cf:"≈ 2"+sub("U","ULm")}[k];
  f.push(["Zaporni napon diode "+sub("U","Rm"),nf(S.piv,1)+" V",pv]);
  $("facts").innerHTML=f.map(function(x){return '<div class="fact"><div class="k">'+x[0]+'</div><div class="val">'+x[1]+'</div><div class="f">'+x[2]+'</div></div>';}).join("");
}
function setOn(id,on){var e=$(id);if(e)e.classList.toggle("on",!!on);}
function drawNow(){
  var i=Math.round(st.t/dt);i=Math.max(0,Math.min(N,i));
  var x=X(i*dt),u=S.u[i],v=S.v[i],k=st.k,ser=SER[k];
  [curV,curI].forEach(function(c){c.setAttribute("x1",x);c.setAttribute("x2",x);});
  dU.setAttribute("cx",x);dU.setAttribute("cy",YV(u));dV.setAttribute("cx",x);dV.setAttribute("cy",YV(v));
  ser.forEach(function(s,j){dots[j].setAttribute("cx",x);dots[j].setAttribute("cy",gI._Y(S.c[s.k][i]));});
  var now=[sub("u","UL")+" = <b>"+nf(u,1)+" V</b>",sub("u","IZ")+" = <b>"+nf(v,1)+" V</b>"];
  var txt="",on=false;
  if(k==="hw"){var a=S.c.iD[i]>0;setOn("hw-D",a);setOn("hw-iD",a);on=a;now.push(sub("i","D")+" = <b>"+fmtI(S.c.iD[i])+"</b>");
    txt=a?"Dioda vodi":(u>0?"Dioda ne vodi (napon manji od "+nf(st.UD,1)+" V)":"Dioda ne vodi (zaporna polarizacija)");}
  else if(k==="ct"){var d1=S.c.iD1[i]>0,d2=S.c.iD2[i]>0;setOn("ct-D1",d1);setOn("ct-iD1",d1);setOn("ct-D2",d2);setOn("ct-iD2",d2);on=d1||d2;
    now.push(sub("i","D1")+" = <b>"+fmtI(S.c.iD1[i])+"</b>");now.push(sub("i","D2")+" = <b>"+fmtI(S.c.iD2[i])+"</b>");
    txt=d1?"Vodi D1 (pozitivna poluperioda)":d2?"Vodi D2 (negativna poluperioda)":"Ne vodi nijedna dioda";}
  else if(k==="br"){var pa=S.c.iA[i]>0,pb=S.c.iB[i]>0;["1","3"].forEach(function(n){setOn("br-D"+n,pa);setOn("br-iD"+n,pa);});["2","4"].forEach(function(n){setOn("br-D"+n,pb);setOn("br-iD"+n,pb);});on=pa||pb;
    now.push(sub("i","D1")+" = "+sub("i","D3")+" = <b>"+fmtI(S.c.iA[i])+"</b>");now.push(sub("i","D2")+" = "+sub("i","D4")+" = <b>"+fmtI(S.c.iB[i])+"</b>");
    txt=pa?"Vode D1 i D3 (pozitivna poluperioda)":pb?"Vode D2 i D4 (negativna poluperioda)":"Ne vodi nijedna dioda";}
  else {var c=S.cond[i],ic=S.c.iC[i],ir=S.c.iR[i];setOn("cf-D",c);setOn("cf-iD",c);setOn("cf-iR",ir>1e-6);setOn("cf-iC",Math.abs(ic)>1e-6);
    var g=$("cf-iCarr"),cc=g.getAttribute("data-c");g.setAttribute("transform",ic<0?"rotate(180 "+cc+")":"");on=c;
    now.push(sub("i","D")+" = <b>"+fmtI(c?ic+ir:0)+"</b>");now.push(sub("i","C")+" = <b>"+fmtI(ic)+"</b>");now.push(sub("i","R")+" = <b>"+fmtI(ir)+"</b>");
    txt=c?"Dioda vodi – kondenzator se puni":"Dioda ne vodi – kondenzator se prazni preko "+'R<sub>T</sub>';}
  $("now").innerHTML=now.map(function(s){return "<span>"+s+"</span>";}).join("");
  var s=$("state");s.innerHTML=txt;s.className="state"+(on?" on":"");
}
function all(){simulate();draw();}
/* kontrole */
document.querySelectorAll(".tabs button").forEach(function(b){b.addEventListener("click",function(){
  st.k=b.getAttribute("data-k");
  document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-selected",x===b);});
  document.querySelectorAll(".circ").forEach(function(c){c.classList.toggle("act",c.getAttribute("data-k")===st.k);});
  $("cBox").classList.toggle("hide",st.k!=="cf");
    all();
});});
$("um").addEventListener("input",function(e){st.Um=parseFloat(e.target.value);$("umO").textContent=nf(st.Um,1)+" V";all();});
$("rt").addEventListener("input",function(e){st.R=100*Math.pow(10,e.target.value/50);$("rtO").textContent=fmtR(st.R);all();});
$("cc").addEventListener("input",function(e){st.C=10*Math.pow(470,e.target.value/1000);$("cO").textContent=fmtC(st.C);all();});
function setD(ud){st.UD=ud;$("bId").setAttribute("aria-pressed",ud===0);$("bSi").setAttribute("aria-pressed",ud!==0);all();}
$("bId").addEventListener("click",function(){setD(0);});$("bSi").addEventListener("click",function(){setD(0.7);});
var last=0;
function loop(ts){if(!st.play)return;if(last)st.t=(st.t+(ts-last)*20/4000)%T;last=ts;drawNow();requestAnimationFrame(loop);}
$("play").addEventListener("click",function(){st.play=!st.play;this.textContent=st.play?"Zaustavi":"Pokreni";last=0;if(st.play)requestAnimationFrame(loop);});
[gV,gI].forEach(function(g){
  var drag=false;
  function seek(e){var r=g.getBoundingClientRect(),vx=(e.clientX-r.left)*720/r.width;st.t=Math.min(T,Math.max(0,(vx-ox)/W*T));drawNow();}
  g.addEventListener("pointerdown",function(e){drag=true;g.setPointerCapture(e.pointerId);seek(e);});
  g.addEventListener("pointermove",function(e){if(drag)seek(e);});
  g.addEventListener("pointerup",function(){drag=false;});
});
st.C=100;$("cO").textContent=fmtC(st.C);
all();
})();
</script></body></html>
