<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analiza pojačala u spoju ZU – simulator</title>
<style>
:root{--bg:#FFFFFF;--ink:#1d1d1d;--muted:#757575;--line:#D9DCE3;--blue:#164194;--blue-soft:#EEF2FA;--gold:#B19E3F;--gold-soft:#F6F2DF;--red:#C00000;--red-soft:#FBEAEA;--off:#ECECEC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181F;--ink:#ECEDF0;--muted:#A3A7B0;--line:#2E3440;--blue:#8EA7E8;--blue-soft:#1E2740;--gold:#D4C06A;--gold-soft:#2D2A1A;--red:#FF7A7A;--red-soft:#3A1E1E;--off:#24272E}}
:root[data-theme="dark"]{--bg:#15181F;--ink:#ECEDF0;--muted:#A3A7B0;--line:#2E3440;--blue:#8EA7E8;--blue-soft:#1E2740;--gold:#D4C06A;--gold-soft:#2D2A1A;--red:#FF7A7A;--red-soft:#3A1E1E;--off:#24272E}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Liberation Sans",Helvetica,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:16px 28px 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tabs button{border:2px solid var(--blue);background:transparent;color:var(--blue);font:inherit;font-size:15px;padding:8px 12px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--blue);color:var(--bg);font-weight:bold}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
svg{display:block;width:100%;height:auto;max-width:100%}
.vi{font-family:"Times New Roman","Liberation Serif",serif;font-style:italic;font-size:1.12em}
.hide{display:none!important}
.cap{font-size:15px;color:var(--muted);margin:10px 0 0;max-width:70ch}
.cap b{color:var(--ink)}
.state{display:block;margin:10px 0 0;text-align:center;font-size:15px;font-weight:bold;padding:8px 12px;border-radius:8px}
.state.sat{color:var(--gold);background:var(--gold-soft)}
.state.bad{color:var(--red);background:var(--red-soft)}
.gt{font-size:15px;color:var(--muted);margin:4px 0 2px 4px}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);margin:0 0 2px 4px}
.leg>span{display:inline-flex;align-items:center;gap:6px}
.leg i.sw{display:inline-block;width:22px;border-top-width:3px;border-top-style:solid}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px 22px;align-items:end;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:15px;color:var(--muted);margin-bottom:8px}
.ctl label output{color:var(--blue);font-weight:bold;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--blue);height:28px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);padding-bottom:6px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--blue)}
.grp{grid-column:1/-1;font-size:14px;color:var(--muted);margin:4px 0 -6px;border-top:1px dashed var(--line);padding-top:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.col h2{margin:0 0 10px;font-size:18px;color:var(--blue)}
.col h2 span{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--blue);color:var(--bg);font-size:15px;margin-right:8px}
.st{margin:0 0 10px;font-size:16px;line-height:1.9}
.st .lbl{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.st b{color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
.st b.gd{color:var(--gold)}
.st b.bd{color:var(--red)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.warn{color:var(--red);font-weight:bold}
.dim{opacity:.35}
@media (max-width:1000px){.stage{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}
</style>
</head>

function fR(k){ if(k>=1000)return n3(k/1000)+" MΩ"; if(k>=1)return n3(k)+" kΩ"; return nf(k*1000,0)+" Ω";}
var view="amp",S;
function P(){return {udd:+$("udd").value,r1:+$("r1").value*1000,r2:+$("r2").value*1000,rd:+$("rd").value,rs:+$("rs").value,cs:$("cs").checked,
  rg:rgVal(),rt:rtVal(),amp:+$("amp").value,K:+$("kk").value,vt:+$("vt").value,lam:+$("lam").value};}
function idm(K,vt,lam,ugs,uds){var vo=ugs-vt;if(vo<=0)return 0;if(uds<=0)return 0;return (uds<vo?K*(vo*uds-uds*uds/2):K/2*vo*vo)*(1+lam*uds);}
function compute(){
  var p=P(),s={p:p};
  s.UGG=p.udd*p.r2/(p.r1+p.r2);
  var RK=p.rs*p.K; s.RK=RK;
  s.b=2/RK-2*p.vt; s.c=p.vt*p.vt-2*s.UGG/RK;
  var D=s.b*s.b-4*s.c; s.D=D;
  s.on=s.UGG>p.vt;
  if(s.on){s.u1=(-s.b+Math.sqrt(D))/2;s.u2=(-s.b-Math.sqrt(D))/2;s.UGSQ=s.u1;s.IDQ=p.K/2*Math.pow(s.UGSQ-p.vt,2);}
  else{s.UGSQ=s.UGG;s.IDQ=0;}
  s.UDSQ=p.udd-s.IDQ*(p.rd+p.rs);
  s.sat=s.on&&s.UDSQ>=s.UGSQ-p.vt;
  s.gm=s.on?p.K*(s.UGSQ-p.vt)*(1+p.lam*s.UDSQ):0;
  s.rd=(p.lam>0&&s.IDQ>0)?1/(p.lam*s.IDQ):Infinity;
  s.RG=par(p.r1,p.r2);
  s.Rl=par(p.rd,p.rt);
  if(p.cs){s.Rsum=par(s.rd,p.rd,p.rt);s.Au=-s.gm*s.Rsum;s.Riz=par(s.rd,p.rd);}
  else{s.Au=-s.gm*s.Rl/(1+s.gm*p.rs);var mu=s.gm*s.rd;s.Riz=isFinite(s.rd)?par(p.rd,s.rd+(1+mu)*p.rs):p.rd;}
  s.div=s.RG/(p.rg+s.RG); s.Aug=s.Au*s.div;
  // large-signal waveforms
  var N=240,Rsac=p.cs?0:p.rs,I0=idm(p.K,p.vt,p.lam,s.UGSQ,s.UDSQ),dist=false,cut=false,tri=false;
  s.w=[];
  for(var k=0;k<=N;k++){
    var t=k/N*2,ug=p.amp/1000*Math.sin(2*Math.PI*t),uul=ug*s.div;
    var lo=0,hi=I0+Math.max(s.UDSQ,0)/(s.Rl+Rsac)+1e-9,i=0;
    if(s.sat){
      for(var j=0;j<70;j++){var m=(lo+hi)/2,ugs=s.UGSQ+uul-(m-I0)*Rsac,uds=s.UDSQ-(m-I0)*(s.Rl+Rsac);
        if(idm(p.K,p.vt,p.lam,ugs,uds)-m>0)lo=m;else hi=m;}
      i=(lo+hi)/2;var ugs2=s.UGSQ+uul-(i-I0)*Rsac,uds2=s.UDSQ-(i-I0)*(s.Rl+Rsac);
      if(ugs2<=p.vt)cut=true; else if(uds2<ugs2-p.vt)tri=true;
    } else i=I0;
    s.w.push({t:t,ug:ug,uul:uul,uiz:-(i-I0)*s.Rl,lin:s.Aug*ug});
  }
  s.cut=cut;s.tri=tri;
  S=s;
}
function axes(g,ox,oy,W,top,yl,ys,yu){
  el(g,"path",{d:"M"+(ox-6)+","+oy+" L"+(ox+W+12)+","+oy,stroke:"var(--muted)","stroke-width":2,fill:"none"});
  el(g,"path",{d:"M"+(ox+W+12)+","+(oy-6)+" L"+(ox+W+24)+","+oy+" L"+(ox+W+12)+","+(oy+6)+" Z",fill:"var(--muted)"});
  el(g,"path",{d:"M"+ox+","+(top+206)+" L"+ox+","+(top+10),stroke:"var(--muted)","stroke-width":2,fill:"none"});
  el(g,"path",{d:"M"+(ox-6)+","+(top+12)+" L"+ox+","+top+" L"+(ox+6)+","+(top+12)+" Z",fill:"var(--muted)"});
  el(g,"text",{x:ox+W+24,y:oy+24,"font-size":17,fill:"var(--muted)","font-family":"Times New Roman, serif","font-style":"italic","text-anchor":"end"},"t");
  var u=el(g,"text",{x:ox+12,y:top+12,"font-size":19,fill:"var(--muted)","font-family":"Times New Roman, serif","font-style":"italic"});u.innerHTML=yl+'<tspan font-size="12" dy="5">'+ys+'</tspan><tspan dy="-5" font-style="normal" font-family="Arial" font-size="13">, '+yu+'</tspan>';
}
function wave(id,series,unitScale,unit,yl,ys){
  var g=$(id);g.innerHTML="";var ox=70,oy=124,W=600,top=12,H=92;
  var mx=0;series.forEach(function(sr){S.w.forEach(function(q){mx=Math.max(mx,Math.abs(q[sr.k]*unitScale));});});
  var YM=nice(Math.max(mx,1e-6)*1.1);
  var X=function(t){return ox+W*t/2;},Y=function(y){return oy-H*y/YM;};
  [-1,-0.5,0.5,1].forEach(function(f){el(g,"line",{x1:ox,y1:Y(f*YM),x2:ox+W,y2:Y(f*YM),stroke:"var(--line)","stroke-width":1});
    el(g,"text",{x:ox-8,y:Y(f*YM)+5,"text-anchor":"end","font-size":13,fill:"var(--muted)"},nf(f*YM,3));});
  axes(g,ox,oy,W,top,yl,ys,unit);
  series.forEach(function(sr){var d="";S.w.forEach(function(q,k){d+=(k?"L":"M")+X(q.t).toFixed(1)+","+Y(q[sr.k]*unitScale).toFixed(1);});
    var a={d:d,fill:"none",stroke:sr.c,"stroke-width":sr.w,"stroke-linejoin":"round"};if(sr.dash)a["stroke-dasharray"]=sr.dash;el(g,"path",a);});
}
function draw(){
  var s=S,p=s.p;
  // schematic toggles
  $("gCS").style.display=p.cs?"":"none";
  $("dW").style.display=p.cs?"":"none";$("dR").style.display=p.cs?"none":"";
  $("vIDQ").textContent=n3(s.IDQ)+" mA";$("vUGSQ").textContent=n3(s.UGSQ)+" V";$("vUDSQ").textContent=n3(s.UDSQ)+" V";
  $("vUGG").innerHTML='<tspan font-family="Times New Roman" font-style="italic">U</tspan><tspan font-size="13" dy="5">GG</tspan><tspan dy="-5"> = '+n3(s.UGG)+' V</tspan>';
  var caps={amp:"Kondenzatori za vezu <b>"+v("C","G")+"</b> i <b>"+v("C","D")+"</b> odvajaju istosmjerne prilike od izvora i trošila. "+(p.cs?"Premosni kondenzator <b>"+v("C","S")+"</b> za signal kratko spaja "+v("R","S")+", pa je uvod na masi.":"Bez "+v("C","S")+" otpornik "+v("R","S")+" ostaje i u dinamičkim prilikama – pojačanje se smanjuje."),
    sta:"Statička analiza: djeluje samo "+v("U","DD")+", kondenzatori se <b>odspajaju</b>. Ostaje sklop s djelilom i "+v("R","S")+" (jednadžbe 10.6–10.9).",
    dyn:"Dinamička analiza: kondenzatori su <b>kratki spoj</b>, "+v("U","DD")+" je spojen na masu, "+v("R","G")+" = "+v("R","1")+PL+v("R","2")+". "+(p.cs?"Uvod je na masi.":"Bez "+v("C","S")+" između uvoda i mase ostaje "+v("R","S")+"."),
    eq:"Tranzistor je zamijenjen modelom za mali signal: strujni izvor "+v("g","m")+v("u","gs")+" i izlazni otpor "+v("r","d")+"."+(p.cs?"":' <span class="warn">Prikazana shema vrijedi uz spojen '+v("C","S")+'; bez njega u uvod treba dodati '+v("R","S")+'.</span>')};
  $("cap").innerHTML=caps[view];
  var st=$("state");
  if(!s.on){st.className="state bad";st.textContent="Tranzistor zapire: UGG ≤ UGS0, struja ne teče";}
  else if(!s.sat){st.className="state bad";st.textContent="Radna točka nije u području zasićenja – pojačalo ne radi ispravno";}
  else{st.className="state sat";st.textContent="Radna točka je u području zasićenja";}
  // waveforms
  var ms=S.w.reduce(function(a,q){return Math.max(a,Math.abs(q.uiz),Math.abs(q.lin));},0);
  var useV=ms>=0.5;
  wave("gI",[{k:"ug",c:"var(--muted)",w:2.2,dash:"7 5"},{k:"uul",c:"var(--blue)",w:3.2}],1000,"mV","u","");
  wave("gO",[{k:"lin",c:"var(--muted)",w:2,dash:"7 5"},{k:"uiz",c:"var(--gold)",w:3.6}],useV?1:1000,useV?"V":"mV","u","IZ");
  var wc="";
  if(!s.sat)wc='<span class="warn">Tranzistor nije u zasićenju pa pojačalo ne pojačava.</span>';
  else if(s.cut)wc='<span class="warn">Izobličenje: u dijelu periode tranzistor zapire ('+v("u","GS")+' &lt; '+v("U","GS0")+'). Smanjite amplitudu.</span>';
  else if(s.tri)wc='<span class="warn">Izobličenje: u dijelu periode tranzistor ulazi u triodno područje. Smanjite amplitudu ili pomaknite radnu točku.</span>';
  else wc="Izlaz je u <b>protufazi</b> s ulazom (negativno pojačanje). Mala razlika prema linearnom modelu posljedica je kvadratne karakteristike tranzistora.";
  $("wcap").innerHTML=wc;
  // steps
  var bad=s.sat?"":" bd";
  var h1='';
  h1+='<p class="st"><span class="lbl">Napon djelila ('+v("I","G")+' = 0)</span>'+v("U","GG")+' = '+fr(v("R","2"),v("R","1")+" + "+v("R","2"))+v("U","DD")+' = '+fr(n3(p.r2/1000),n3(p.r1/1000)+" + "+n3(p.r2/1000))+'·'+n3(p.udd)+' = <b>'+n3(s.UGG)+' V</b></p>';
  h1+='<p class="st"><span class="lbl">Ulazni krug</span>'+v("U","GG")+' = '+v("U","GSQ")+' + '+v("R","S")+fr(v("K"),"2")+'('+v("U","GSQ")+' − '+v("U","GS0")+')²</p>';
  if(s.on){
    var sg=function(x){return (x<0?" − ":" + ")+n3(Math.abs(x));};
    h1+='<p class="st"><span class="lbl">Kvadratna jednadžba uz '+v("R","S")+v("K")+' = '+n3(s.RK)+' V⁻¹</span>'+v("U","GSQ")+'²'+sg(s.b)+'·'+v("U","GSQ")+sg(s.c)+' = 0</p>';
    h1+='<p class="st">'+v("U","GSQ")+' = '+fr(n3(-s.b)+" ± "+n3(Math.sqrt(s.D)),"2")+' → <b>'+n3(s.u1)+' V</b> <span class="lbl">(rješenje '+n3(s.u2)+' V &lt; '+v("U","GS0")+' se odbacuje)</span></p>';
    h1+='<p class="st"><span class="lbl">Struja odvoda</span>'+v("I","DQ")+' = '+fr(v("K"),"2")+'('+v("U","GSQ")+' − '+v("U","GS0")+')² = '+fr(n3(p.K),"2")+'·('+n3(s.UGSQ)+' − '+n3(p.vt)+')² = <b>'+n3(s.IDQ)+' mA</b></p>';
    h1+='<p class="st"><span class="lbl">Napon odvod–uvod</span>'+v("U","DSQ")+' = '+v("U","DD")+' − '+v("I","DQ")+'('+v("R","D")+' + '+v("R","S")+') = '+n3(p.udd)+' − '+n3(s.IDQ)+'·('+n3(p.rd)+' + '+n3(p.rs)+') = <b class="'+bad+'">'+n3(s.UDSQ)+' V</b></p>';
    h1+='<p class="st"><span class="lbl">Provjera zasićenja</span>'+v("U","DSQ")+' = '+n3(s.UDSQ)+' V '+(s.sat?'≥':'&lt;')+' '+v("U","GSQ")+' − '+v("U","GS0")+' = '+n3(s.UGSQ-p.vt)+' V → <b class="'+(s.sat?'gd':'bd')+'">'+(s.sat?'zasićenje':'nije zasićenje')+'</b></p>';
  } else h1+='<p class="st warn">'+v("U","GG")+' ≤ '+v("U","GS0")+': tranzistor zapire, '+v("I","DQ")+' = 0.</p>';
  $("s1").innerHTML=h1;
  var h2='';
  h2+='<p class="st"><span class="lbl">Strmina</span>'+v("g","m")+' = '+v("K")+'('+v("U","GSQ")+' − '+v("U","GS0")+')(1 + '+v("λ")+v("U","DSQ")+')</p>';
  h2+='<p class="st">'+v("g","m")+' = '+n3(p.K)+'·('+n3(s.UGSQ)+' − '+n3(p.vt)+')·(1 + '+nf(p.lam,3)+'·'+n3(s.UDSQ)+') = <b>'+n3(s.gm)+' mA/V</b></p>';
  h2+='<p class="st"><span class="lbl">Izlazni otpor tranzistora</span>'+fr("1",v("r","d"))+' = '+v("λ")+v("I","DQ")+' = '+nf(p.lam,3)+'·'+n3(s.IDQ)+' = '+n3(p.lam*s.IDQ*1000)+' µS</p>';
  h2+='<p class="st">'+v("r","d")+' = '+fr("1",v("λ")+v("I","DQ"))+' = <b>'+(isFinite(s.rd)?fR(s.rd):"∞")+'</b></p>';
  h2+='<p class="st"><span class="lbl">Faktor naponskog pojačanja</span>'+v("μ")+' = '+v("g","m")+v("r","d")+' = <b>'+(isFinite(s.rd)?n3(s.gm*s.rd):"∞")+'</b></p>';
  $("s2").innerHTML=h2;
  var h3='';
  if(p.cs){
    h3+='<p class="st"><span class="lbl">Naponsko pojačanje</span>'+v("A","u")+' = '+fr(v("u","IZ"),v("u","UL"))+' = −'+v("g","m")+'('+v("r","d")+PL+v("R","D")+PL+v("R","T")+')</p>';
    h3+='<p class="st">'+v("A","u")+' = −'+n3(s.gm)+'·('+(isFinite(s.rd)?n3(s.rd):"∞")+PL+n3(p.rd)+PL+n3(p.rt)+') = −'+n3(s.gm)+'·'+n3(s.Rsum)+' = <b class="'+bad+'">'+g3(s.Au)+'</b></p>';
  } else {
    h3+='<p class="st"><span class="lbl">Naponsko pojačanje bez '+v("C","S")+' ('+v("r","d")+' zanemaren)</span>'+v("A","u")+' ≈ −'+fr(v("g","m")+'('+v("R","D")+PL+v("R","T")+')','1 + '+v("g","m")+v("R","S"))+'</p>';
    h3+='<p class="st">'+v("A","u")+' ≈ −'+fr(n3(s.gm)+'·'+n3(s.Rl),'1 + '+n3(s.gm)+'·'+n3(p.rs))+' = <b class="'+bad+'">'+g3(s.Au)+'</b></p>';
  }
  h3+='<p class="st"><span class="lbl">Ulazni otpor</span>'+v("R","UL")+' = '+v("R","G")+' = '+v("R","1")+PL+v("R","2")+' = '+n3(p.r1/1000)+PL+n3(p.r2/1000)+' = <b>'+fR(s.RG)+'</b></p>';
  h3+='<p class="st"><span class="lbl">Pojačanje od izvora signala</span>'+v("A","ug")+' = '+fr(v("u","IZ"),v("u","g"))+' = '+v("A","u")+fr(v("R","G"),v("R","g")+" + "+v("R","G"))+' = '+g3(s.Au)+'·'+fr(fR(s.RG),fR(p.rg)+" + "+fR(s.RG))+' = <b class="'+bad+'">'+g3(s.Aug)+'</b></p>';
  if(p.cs) h3+='<p class="st"><span class="lbl">Izlazni otpor</span>'+v("R","IZ")+' = '+v("r","d")+PL+v("R","D")+' = <b>'+fR(s.Riz)+'</b></p>';
  else h3+='<p class="st"><span class="lbl">Izlazni otpor</span>'+v("R","IZ")+' = '+v("R","D")+PL+'['+v("r","d")+' + (1 + '+v("μ")+')'+v("R","S")+'] ≈ '+v("R","D")+' = <b>'+fR(s.Riz)+'</b></p>';
  $("s3").innerHTML=h3;
  // outputs
  $("uddO").textContent=nf(p.udd,1)+" V";$("r1O").textContent=fR(p.r1);$("r2O").textContent=fR(p.r2);
  $("rdO").textContent=fR(p.rd);$("rsO").textContent=fR(p.rs);$("rgO").textContent=fR(p.rg);$("rtO").textContent=fR(p.rt);
  $("ampO").textContent=nf(p.amp,0)+" mV";$("kkO").textContent=nf(p.K,1)+" mA/V²";$("vtO").textContent=nf(p.vt,1)+" V";$("lamO").textContent=nf(p.lam,3)+" V⁻¹";
}
function upd(){compute();draw();}
document.querySelectorAll("input").forEach(function(i){i.addEventListener("input",upd);});
document.querySelectorAll(".tabs button").forEach(function(b){b.addEventListener("click",function(){
  view=b.dataset.v;document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-selected",x===b?"true":"false");});
  ["amp","sta","dyn","eq"].forEach(function(k){$("v_"+k).classList.toggle("hide",k!==view);});draw();});});
upd();
})();
</script>
